<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TDG Simulator - Rebel Hounds MC</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #c0392b;
      --dark: #0a0a0a;
      --dark-2: #141414;
      --dark-3: #1a1a1a;
      --text: #e8e8e8;
      --muted: #777;
      --border: #222;
      --font-display: 'Bebas Neue', sans-serif;
      --font-body: 'Rajdhani', sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font-body);
      background: var(--dark);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .top-bar {
      background: var(--dark-2);
      border-bottom: 1px solid var(--border);
      padding: 0.5rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-shrink: 0;
      z-index: 1000;
    }
    .top-bar-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .top-bar-left img {
      width: 28px;
      height: 28px;
      border-radius: 50%;
    }
    .top-bar-title {
      font-family: var(--font-display);
      font-size: 1.1rem;
      letter-spacing: 2px;
    }
    .top-bar-title span { color: var(--primary); }
    .layer-btns {
      display: flex;
      gap: 0.35rem;
    }
    .layer-btn {
      padding: 0.35rem 0.75rem;
      font-family: var(--font-body);
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      background: var(--dark-3);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .layer-btn:hover { color: var(--text); border-color: var(--primary); }
    .layer-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; }
    .top-bar-right a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .top-bar-right a:hover { color: var(--text); }
    #map {
      flex: 1;
      background: var(--dark);
    }
    .leaflet-container { background: var(--dark) !important; }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="top-bar-left">
      <img src="rebel-hounds-patch.png" alt="RHMC">
      <span class="top-bar-title">TDG <span>SIMULATOR</span></span>
    </div>
    <div class="layer-btns">
      <button class="layer-btn active" data-layer="Satellite">SAT</button>
      <button class="layer-btn" data-layer="Roadmap">ROAD</button>
      <button class="layer-btn" data-layer="Atlas">ATLAS</button>
    </div>
    <div class="top-bar-right">
      <a href="portal-map.html">BACK TO MAP</a>
    </div>
  </div>

  <div id="map"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script>
    var map = L.map('map', {
      center: [0, 0],
      zoom: 3,
      minZoom: 0,
      maxZoom: 11,
      zoomControl: true,
      attributionControl: false
    });

    var MAX_NATIVE_ZOOM = 7;

    var layers = {
      Satellite: L.tileLayer('Satellite/{z}_{x}_{y}.jpg', {
        maxNativeZoom: MAX_NATIVE_ZOOM,
        tileSize: 256,
        noWrap: true
      }),
      Roadmap: L.tileLayer('Roadmap/{z}_{x}_{y}.jpg', {
        maxNativeZoom: MAX_NATIVE_ZOOM,
        tileSize: 256,
        noWrap: true
      }),
      Atlas: L.tileLayer('Atlas/{z}_{x}_{y}.jpg', {
        maxNativeZoom: MAX_NATIVE_ZOOM,
        tileSize: 256,
        noWrap: true
      })
    };

    var currentLayer = 'Satellite';
    layers.Satellite.addTo(map);

    document.querySelectorAll('.layer-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var layerName = btn.dataset.layer;
        if (layerName === currentLayer) return;

        map.removeLayer(layers[currentLayer]);
        layers[layerName].addTo(map);
        currentLayer = layerName;

        document.querySelectorAll('.layer-btn').forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
      });
    });
  </script>
</body>
</html>
